asyncapi: 3.0.0
info:
  title: OpenReceive verified payment events
  version: 0.2.0
  description: >
    The server-side onPaid callback is at-least-once. NWC notifications are
    authenticated wallet data: a payment_received payload that carries a
    finality signal (settled_at or a settled transaction state; never a
    preimage alone) settles the matching pending attempt directly, in both
    engines. A payload without a finality signal or with an unknown payment
    hash only wakes a bounded reconciliation scan, and the periodic poll pass
    remains the safety net for notifications missed while offline.
channels:
  verifiedPayments:
    address: openreceive://verified-payments
    messages:
      paymentSettled:
        $ref: '#/components/messages/paymentSettled'
operations:
  observeVerifiedPayments:
    action: receive
    channel:
      $ref: '#/channels/verifiedPayments'
components:
  messages:
    paymentSettled:
      name: payment.settled
      payload:
        $ref: '#/components/schemas/PaidPayment'
  schemas:
    PaidPayment:
      description: >
        The settled-payment payload. Each engine spells it in its own
        convention — JS camelCase (paymentHash/paidAt), Ruby snake_case
        (payment_hash/paid_at) — so both spellings are listed, the same way
        spec/schemas/swap-data.schema.json documents that split. The FIELDS are
        the contract; the casing follows the host language.
      oneOf:
        - title: JS engine (camelCase)
          type: object
          additionalProperties: false
          required: [paymentHash, paidAt]
          properties:
            paymentHash: { type: string, pattern: '^[0-9a-f]{64}$' }
            paidAt: { type: integer, minimum: 0 }
            details: { type: object, additionalProperties: true }
        - title: Ruby engine (snake_case)
          type: object
          additionalProperties: false
          required: [payment_hash, paid_at]
          properties:
            payment_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
            paid_at: { type: integer, minimum: 0 }
            details: { type: object, additionalProperties: true }
