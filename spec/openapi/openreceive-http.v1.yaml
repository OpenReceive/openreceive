openapi: 3.1.0
info:
  title: OpenReceive host-owned payment HTTP API
  version: 0.4.0
  description: >
    Mounted receive-checkout routes. The host owns what is being paid for and its price; the library owns the openreceive_payments rows (they live in the host's database).
    It resolves every checkout amount and stores each payment attempt before a payer response.
servers:
  - url: /openreceive
paths:
  /checkouts/prepare:
    post:
      operationId: prepareCheckout
      summary: Lock the host-resolved amount without minting Lightning.
      description: >
        Resolves the trusted host price to amount_msats and returns swap
        payment_methods. Does not mint a bolt11 or commit an openreceive_payments
        row. Clients show the method picker first; POST /checkouts mints Lightning
        only after the payer selects Bitcoin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrepareCheckoutRequest'
      responses:
        '200':
          description: Amount lock and payment methods for the deferred checkout UI.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepareCheckoutResponse'
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '405': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /checkouts:
    post:
      operationId: createCheckout
      summary: Mint an invoice using the host-resolved price.
      description: >
        The request cannot supply an amount. The mounted handler asks the required
        host integration for the trusted price, mints an invoice, and returns
        payer instructions only after the host persists payment_hash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckoutRequest'
      responses:
        '201':
          description: Checkout committed by the host.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCheckoutResponse'
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '405': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /payments/check:
    post:
      operationId: checkPayment
      summary: Verify one host-owned payment attempt against the receive wallet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCheckRequest'
      responses:
        '200':
          description: Current wallet-derived payment state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCheck'
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '405': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /swaps/quote:
    post:
      operationId: quoteSwap
      summary: Obtain a non-binding swap quote.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwapQuoteRequest'
      responses:
        '200':
          description: Provider quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapQuote'
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '405': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /swaps:
    post:
      operationId: createSwap
      summary: Create a swap using the host-resolved price.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSwapRequest'
      responses:
        '201':
          description: Swap committed by the host.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSwapResponse'
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '405': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /swaps/status:
    post:
      operationId: getSwap
      summary: Refresh provider state using server-only swap data loaded by the host.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '200':
          description: Provider-derived swap state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Swap'
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '405': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /swaps/refunds:
    post:
      operationId: refundSwap
      summary: Refresh provider state, then request an eligible refund.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reference, payment_hash, refund_address]
              properties:
                reference: { type: string, minLength: 1, maxLength: 200 }
                payment_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
                refund_address: { type: string, minLength: 1 }
      responses:
        '200':
          description: Provider-derived refund state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Swap'
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '405': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /rates:
    get:
      operationId: listRates
      parameters:
        - in: query
          name: currencies
          schema: { type: string }
      responses:
        '200':
          description: Current process-cached BTC/fiat rates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatesResponse'
        '400': { $ref: '#/components/responses/Error' }
        '405': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  responses:
    Error:
      description: OpenReceive error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    PrepareCheckoutRequest:
      type: object
      additionalProperties: false
      required: [reference]
      properties:
        reference: { type: string, minLength: 1, maxLength: 200 }
    PrepareCheckoutResponse:
      type: object
      additionalProperties: false
      required: [reference, amount_msats, payment_methods]
      properties:
        reference: { type: string, minLength: 1, maxLength: 200 }
        amount_msats: { type: integer, minimum: 1000, maximum: 9007199254740991 }
        fiat_quote:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/FiatQuote' }
        payment_methods:
          type: array
          items: { $ref: '#/components/schemas/PaymentMethod' }
    CreateCheckoutRequest:
      type: object
      additionalProperties: false
      required: [reference]
      properties:
        reference: { type: string, minLength: 1, maxLength: 200 }
        memo: { type: string, maxLength: 500 }
        metadata: { type: object, additionalProperties: true }
    Checkout:
      type: object
      additionalProperties: false
      required: [reference, payment_hash, bolt11, amount_msats, created_at, expires_at]
      properties:
        reference: { type: string, minLength: 1, maxLength: 200 }
        payment_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        bolt11: { type: string, minLength: 1 }
        amount_msats: { type: integer, minimum: 1000, maximum: 9007199254740991 }
        created_at: { type: integer, minimum: 0 }
        expires_at: { type: integer, minimum: 0 }
        fiat_quote:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/FiatQuote' }
    CreateCheckoutResponse:
      type: object
      additionalProperties: false
      required: [checkout]
      properties:
        checkout: { $ref: '#/components/schemas/Checkout' }
    PaymentCheckRequest:
      type: object
      additionalProperties: false
      required: [reference, payment_hash]
      properties:
        reference: { type: string, minLength: 1, maxLength: 200 }
        payment_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
    PaymentStatus:
      type: string
      enum: [pending, settled, expired, failed, not_found]
    PaymentMethod:
      description: One swap pay-in option for an invoice amount.
      type: object
      additionalProperties: false
      required: [pay_in_asset, label, network_label, provider, available]
      properties:
        pay_in_asset: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        network_label: { type: string, minLength: 1 }
        provider: { type: string }
        available: { type: boolean }
        unavailable_reason: { type: string }
        unavailable_message: { type: string }
        pay_amount: { type: string }
        minimum_pay_amount: { type: string }
        maximum_pay_amount: { type: string }
        minimum_invoice_amount_msats: { type: integer, minimum: 0 }
        maximum_invoice_amount_msats: { type: integer, minimum: 0 }
    FiatQuote:
      # Kept in lockstep with spec/schemas/rate-quote.schema.json: the quote the
      # checkout was priced from, snake_case on the wire.
      type: object
      additionalProperties: false
      required: [fiat, btc_fiat_price, amount_sats, amount_msats, source, as_of, expires_at]
      properties:
        fiat:
          type: object
          additionalProperties: false
          required: [currency, value]
          properties:
            currency: { type: string, pattern: '^[A-Z]{3}$' }
            value: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
        btc_fiat_price: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
        amount_sats: { type: integer, minimum: 1, maximum: 9007199254740 }
        amount_msats: { type: integer, minimum: 1000, maximum: 9007199254740991 }
        source: { type: string, enum: [static_mock, primary, fallback] }
        as_of: { type: integer, minimum: 0 }
        expires_at: { type: integer, minimum: 0 }
    PaymentDetails:
      description: >
        The wallet row that proved settlement, reduced to its payer-facing
        fields (never the preimage, the full invoice, or wallet metadata).
      type: object
      additionalProperties: false
      required: [observed_at]
      properties:
        transaction:
          type: object
          additionalProperties: false
          properties:
            payment_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
            state: { type: string }
            transaction_state: { type: string }
            amount_msats: { type: integer, minimum: 0 }
            fees_paid_msats: { type: integer, minimum: 0 }
            created_at: { type: integer, minimum: 0 }
            settled_at: { type: integer, minimum: 0 }
            expires_at: { type: integer, minimum: 0 }
        observed_at: { type: integer, minimum: 0 }
        paid_at_source: { type: string, enum: [settled_at, observed_at] }
    PaymentCheck:
      type: object
      additionalProperties: false
      required: [payment_hash, status, payment_methods]
      properties:
        payment_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        paid_at: { type: integer, minimum: 0 }
        details: { $ref: '#/components/schemas/PaymentDetails' }
        payment_methods:
          type: array
          description: >
            Swap pay-in options for this invoice amount. Empty when no LSC
            provider is configured. Present even while Lightning is the only rail
            so clients can stop showing a currencies loader.
          items: { $ref: '#/components/schemas/PaymentMethod' }
    SwapQuoteRequest:
      type: object
      additionalProperties: false
      required: [reference, pay_in_asset]
      properties:
        reference: { type: string, minLength: 1, maxLength: 200 }
        pay_in_asset: { type: string, minLength: 1 }
    CreateSwapRequest:
      type: object
      additionalProperties: false
      required: [reference, pay_in_asset]
      properties:
        reference: { type: string, minLength: 1, maxLength: 200 }
        pay_in_asset: { type: string, minLength: 1 }
        memo: { type: string, maxLength: 500 }
        metadata: { type: object, additionalProperties: true }
    SwapPayInAsset:
      description: >
        Closed set of supported pay-in assets (COIN_NETWORK). Requests accept any
        string and refuse unknown values with INVALID_REQUEST; responses only ever
        carry one of these.
      type: string
      enum: [SOL_SOL, USDT_TRON, USDT_SOL, USDC_SOL, ETH_ETH, USDT_ETH, USDC_ETH]
    SwapProviderState:
      description: Provider-derived lifecycle state of a swap attempt.
      type: string
      enum:
        - creating_provider_order
        - awaiting_deposit
        - confirming
        - exchanging
        - paying_invoice
        - completed
        - expired
        - refund_required
        - refund_pending
        - refunded
        - attention
        - failed
    SwapFee:
      description: >
        Fiat equivalents explaining why the payer sends more crypto than the cart
        total. Sourced from the provider's own quote; never a price authority —
        the invoice amount is. Values are decimal strings.
      type: object
      additionalProperties: false
      required: [currency, pay_in_fiat, payout_fiat]
      properties:
        currency: { type: string, minLength: 1 }
        pay_in_fiat: { type: string, minLength: 1 }
        payout_fiat: { type: string, minLength: 1 }
    SwapQuote:
      description: Non-binding provider quote for one pay-in asset.
      type: object
      additionalProperties: false
      required: [provider, pay_asset, available]
      properties:
        provider: { type: string }
        pay_asset: { $ref: '#/components/schemas/SwapPayInAsset' }
        available: { type: boolean }
        pay_amount: { type: string }
        minimum_pay_amount: { type: string }
        maximum_pay_amount: { type: string }
        minimum_invoice_amount_msats: { type: integer, minimum: 0 }
        maximum_invoice_amount_msats: { type: integer, minimum: 0 }
        unavailable_reason: { type: string }
        unavailable_message: { type: string }
    SwapBase:
      # The fields of a swap attempt, open so Swap and SwapCheckout can compose it;
      # each of those closes itself with unevaluatedProperties: false.
      description: >
        Payer-facing swap attempt state (the PublicSwap service object on the
        wire). Never carries swap_data — provider recovery state is server-only.
      type: object
      required:
        - payment_hash
        - reference
        - provider
        - pay_in_asset
        - deposit_address
        - deposit_amount
        - provider_state
        - provider_expires_at
      properties:
        payment_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        reference: { type: string, minLength: 1, maxLength: 200 }
        provider: { type: string, minLength: 1 }
        pay_in_asset: { $ref: '#/components/schemas/SwapPayInAsset' }
        deposit_address: { type: string, minLength: 1 }
        deposit_memo: { type: string }
        deposit_amount: { type: string, minLength: 1 }
        provider_state: { $ref: '#/components/schemas/SwapProviderState' }
        provider_expires_at: { type: integer, minimum: 0 }
        deposit_tx_id: { type: string }
        payout_tx_id: { type: string }
        refund_tx_id: { type: string }
        refund_reason: { type: string }
        refund_amount: { type: string }
        attention: { type: boolean }
        attention_reason: { type: string }
        deposit_received_amount: { type: string }
        emergency_repeat: { type: boolean }
        provider_order_id: { type: string }
        fee: { $ref: '#/components/schemas/SwapFee' }
    Swap:
      description: Payer-facing swap attempt state on the wire.
      allOf:
        - $ref: '#/components/schemas/SwapBase'
      unevaluatedProperties: false
    SwapCheckout:
      # Swap plus the committed shadow checkout, by composition: OpenAPI 3.1 is
      # JSON Schema 2020-12, where unevaluatedProperties: false closes an allOf
      # the way additionalProperties: false cannot.
      description: A committed swap attempt with its Lightning shadow checkout.
      allOf:
        - $ref: '#/components/schemas/SwapBase'
        - type: object
          required: [checkout]
          properties:
            checkout: { $ref: '#/components/schemas/Checkout' }
      unevaluatedProperties: false
    CreateSwapResponse:
      type: object
      additionalProperties: false
      required: [swap]
      properties:
        swap: { $ref: '#/components/schemas/SwapCheckout' }
    RatesResponse:
      description: >
        Current process-cached BTC/fiat rates. `bitcoin` maps lowercase ISO 4217
        codes to decimal-string prices in units of fiat per 1 BTC.
      type: object
      additionalProperties: false
      required: [bitcoin]
      properties:
        bitcoin:
          type: object
          additionalProperties: { type: string }
    OrderRequest:
      type: object
      additionalProperties: false
      required: [reference, payment_hash]
      properties:
        reference: { type: string, minLength: 1, maxLength: 200 }
        payment_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          # Kept in lockstep with spec/schemas/error.schema.json.
          type: string
          enum:
            - NOT_IMPLEMENTED
            - RESTRICTED
            - UNAUTHORIZED
            - FORBIDDEN
            - RATE_LIMITED
            - QUOTA_EXCEEDED
            - INTERNAL
            - UNSUPPORTED_ENCRYPTION
            - OTHER
            - NOT_FOUND
            - TIMEOUT
            - INVALID_REQUEST
            - WALLET_UNAVAILABLE
            - INVOICE_EXPIRED
            - UNSUPPORTED_METHOD
            - CONFLICT
        message: { type: string, minLength: 1 }
        request_id: { type: string }
        retryable: { type: boolean }
        details:
          type: object
          additionalProperties: true
