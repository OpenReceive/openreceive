# TLS in front of the plain-ws Nostr relay: the plugin's NWC parser accepts wss only.
# The upstream is resolved per request through Docker's DNS so a recreated relay
# container (new IP) does not leave nginx pinned to a dead address.
server {
    listen 443 ssl;
    server_name relay-tls localhost;
    ssl_certificate     /certs/relay-tls.crt;
    ssl_certificate_key /certs/relay-tls.key;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $relay_upstream http://relay:8080;
        proxy_pass $relay_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
