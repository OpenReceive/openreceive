# OpenReceive BTCPay plugin — regtest end-to-end stack, entirely in Docker.
#
#   bitcoind + nbxplorer + postgres      BTCPay's chain plumbing (regtest)
#   merchant_lnd                         the REMOTE wallet behind the testkit NWC service
#   customer_lnd                         the payer (and the fake provider's payout node)
#   relay + relay-tls                    a real Nostr relay behind TLS (NWC URIs must be wss)
#   testkit-nwc                          NIP-47 wallet service (plays Alby Hub), backed by merchant_lnd
#   fake-lsc                             FixedFloat-compatible swap provider, pays bolt11s from customer_lnd
#   btcpayserver                         the official 2.4.2 image with the plugin bind-mounted in
#
# Driver scripts live beside this file: up.sh, regtest-fund.sh, build-plugin.sh.
name: openreceive-btcpay

services:
  certs:
    image: alpine:3.20
    command: ["sh", "/scripts/make-certs.sh", "/certs"]
    volumes:
      - certs:/certs
      - ./certs/make-certs.sh:/scripts/make-certs.sh:ro

  bitcoind:
    image: btcpayserver/bitcoin:29.2
    restart: unless-stopped
    environment:
      BITCOIN_NETWORK: regtest
      BITCOIN_WALLETDIR: "/data/wallets"
      BITCOIN_EXTRA_ARGS: |-
        rpcuser=ceiwHEbqWI83
        rpcpassword=DwubwWsoo3
        rpcport=43782
        rpcbind=0.0.0.0:43782
        rpcallowip=0.0.0.0/0
        port=39388
        whitelist=0.0.0.0/0
        zmqpubrawblock=tcp://0.0.0.0:28332
        zmqpubrawtx=tcp://0.0.0.0:28333
        deprecatedrpc=signrawtransaction
        fallbackfee=0.0002
        minrelaytxfee=0.00001000
        unsafesqlitesync=1
    expose:
      - "43782"
      - "39388"
      - "28332"
      - "28333"
    volumes:
      - bitcoin_datadir:/data

  nbxplorer:
    image: nicolasdorier/nbxplorer:2.6.10
    restart: unless-stopped
    environment:
      NBXPLORER_NETWORK: regtest
      NBXPLORER_CHAINS: "btc"
      NBXPLORER_BTCRPCURL: http://bitcoind:43782/
      NBXPLORER_BTCNODEENDPOINT: bitcoind:39388
      NBXPLORER_BTCRPCUSER: ceiwHEbqWI83
      NBXPLORER_BTCRPCPASSWORD: DwubwWsoo3
      NBXPLORER_BIND: 0.0.0.0:32838
      NBXPLORER_MINGAPSIZE: 5
      NBXPLORER_MAXGAPSIZE: 10
      NBXPLORER_POSTGRES: User ID=postgres;Include Error Detail=true;Host=postgres;Port=5432;Database=nbxplorer
      NBXPLORER_EXPOSERPC: 1
      NBXPLORER_NOAUTH: 1
    expose:
      - "32838"
    depends_on:
      bitcoind:
        condition: service_started
      postgres:
        condition: service_healthy

  postgres:
    image: btcpayserver/postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    command: ["-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
    expose:
      - "5432"
    volumes:
      - postgres_datadir:/var/lib/postgresql

  merchant_lnd:
    image: btcpayserver/lnd:v0.21.1-beta
    restart: unless-stopped
    environment:
      LND_CHAIN: "btc"
      LND_ENVIRONMENT: "regtest"
      LND_EXPLORERURL: "http://nbxplorer:32838/"
      LND_REST_LISTEN_HOST: http://merchant_lnd:8080
      LND_EXTRA_ARGS: |
        restlisten=merchant_lnd:8080
        rpclisten=127.0.0.1:10008
        rpclisten=merchant_lnd:10009
        bitcoin.node=bitcoind
        bitcoind.rpchost=bitcoind:43782
        bitcoind.rpcuser=ceiwHEbqWI83
        bitcoind.rpcpass=DwubwWsoo3
        bitcoind.zmqpubrawblock=tcp://bitcoind:28332
        bitcoind.zmqpubrawtx=tcp://bitcoind:28333
        externalip=merchant_lnd:9735
        bitcoin.defaultchanconfs=1
        no-macaroons=1
        no-rest-tls=1
        trickledelay=1000
    expose:
      - "8080"
      - "9735"
      - "10009"
    volumes:
      - merchant_lnd_datadir:/data
      - bitcoin_datadir:/deps/.bitcoin
    depends_on:
      - bitcoind
      - nbxplorer

  customer_lnd:
    image: btcpayserver/lnd:v0.21.1-beta
    restart: unless-stopped
    environment:
      LND_CHAIN: "btc"
      LND_ENVIRONMENT: "regtest"
      LND_EXPLORERURL: "http://nbxplorer:32838/"
      LND_REST_LISTEN_HOST: http://customer_lnd:8080
      LND_EXTRA_ARGS: |
        restlisten=customer_lnd:8080
        rpclisten=127.0.0.1:10008
        rpclisten=customer_lnd:10009
        bitcoin.node=bitcoind
        bitcoind.rpchost=bitcoind:43782
        bitcoind.rpcuser=ceiwHEbqWI83
        bitcoind.rpcpass=DwubwWsoo3
        bitcoind.zmqpubrawblock=tcp://bitcoind:28332
        bitcoind.zmqpubrawtx=tcp://bitcoind:28333
        externalip=customer_lnd:9735
        bitcoin.defaultchanconfs=1
        no-macaroons=1
        no-rest-tls=1
        trickledelay=1000
    expose:
      - "8080"
      - "9735"
      - "10009"
    volumes:
      - customer_lnd_datadir:/data
      - bitcoin_datadir:/deps/.bitcoin
    depends_on:
      - bitcoind
      - nbxplorer

  relay:
    image: scsibug/nostr-rs-relay:latest
    restart: unless-stopped
    user: "0:0"
    environment:
      RUST_LOG: "warn,nostr_rs_relay=info"
    volumes:
      - ./relay/config.toml:/usr/src/app/config.toml:ro
      - relay_data:/usr/src/app/db
    expose:
      - "8080"

  relay-tls:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/relay.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/certs:ro
    expose:
      - "443"
    depends_on:
      certs:
        condition: service_completed_successfully
      relay:
        condition: service_started

  testkit-nwc:
    build:
      context: ..
      dockerfile: OpenReceive.TestkitNwc/Dockerfile
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        cp /certs/ca.crt /usr/local/share/ca-certificates/openreceive-ca.crt &&
        update-ca-certificates >/dev/null 2>&1;
        exec dotnet OpenReceive.TestkitNwc.dll
        --relay wss://relay-tls/
        --lnd "type=lnd-rest;server=http://merchant_lnd:8080/;allowinsecure=true"
        --network regtest
        --out /out/nwc-uri.txt
        --control-port 7790
        $TESTKIT_NWC_EXTRA_ARGS
    environment:
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      TESTKIT_NWC_EXTRA_ARGS: ${TESTKIT_NWC_EXTRA_ARGS:-}
      ASPNETCORE_URLS: http://0.0.0.0:7790
    volumes:
      - certs:/certs:ro
      - testkit_out:/out
    ports:
      - "127.0.0.1:17790:7790"
    depends_on:
      certs:
        condition: service_completed_successfully
      relay-tls:
        condition: service_started
      merchant_lnd:
        condition: service_started

  # A second wallet service that ADVERTISES a spend method, to prove the receive-only
  # preflight fails closed (and that the explicit override lets it through).
  testkit-nwc-spend:
    build:
      context: ..
      dockerfile: OpenReceive.TestkitNwc/Dockerfile
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        cp /certs/ca.crt /usr/local/share/ca-certificates/openreceive-ca.crt &&
        update-ca-certificates >/dev/null 2>&1;
        exec dotnet OpenReceive.TestkitNwc.dll
        --relay wss://relay-tls/
        --memory
        --network regtest
        --grant pay_invoice
        --control-port 7790
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:7790
    volumes:
      - certs:/certs:ro
    ports:
      - "127.0.0.1:17791:7790"
    depends_on:
      certs:
        condition: service_completed_successfully
      relay-tls:
        condition: service_started

  fake-lsc:
    build:
      context: ..
      dockerfile: OpenReceive.FakeLsc/Dockerfile
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec dotnet OpenReceive.FakeLsc.dll
        --port 7788
        --key test-key --secret test-secret
        --cert /certs/fake-lsc.pfx --cert-password openreceive
        --payer "type=lnd-rest;server=http://customer_lnd:8080/;allowinsecure=true"
        --network regtest
    volumes:
      - certs:/certs:ro
    ports:
      - "127.0.0.1:17788:7788"
    depends_on:
      certs:
        condition: service_completed_successfully
      customer_lnd:
        condition: service_started

  btcpayserver:
    image: btcpayserver/btcpayserver:2.4.2
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/or-entrypoint.sh"]
    environment:
      BTCPAY_NETWORK: regtest
      BTCPAY_BIND: 0.0.0.0:49392
      BTCPAY_ROOTPATH: /
      BTCPAY_CHAINS: "btc"
      BTCPAY_BTCEXPLORERURL: http://nbxplorer:32838/
      BTCPAY_POSTGRES: User ID=postgres;Host=postgres;Port=5432;Application Name=btcpayserver;Database=btcpayserverregtest
      BTCPAY_EXPLORERPOSTGRES: User ID=postgres;Host=postgres;Port=5432;Application Name=btcpayserver;MaxPoolSize=80;Database=nbxplorer
      BTCPAY_ALLOW-ADMIN-REGISTRATION: "true"
      BTCPAY_CHEATMODE: "true"
      BTCPAY_DEBUGLOG: btcpay.log
      BTCPAY_UPDATEURL: ""
      BTCPAY_RECOMMENDED-PLUGINS: ""
      BTCPAY_DOCKERDEPLOYMENT: "false"
    ports:
      - "127.0.0.1:14180:49392"
    volumes:
      - btcpay_datadir:/datadir
      - ./.state/plugins:/root/.btcpayserver/Plugins
      - ./btcpay-entrypoint.sh:/usr/local/bin/or-entrypoint.sh:ro
      - certs:/certs:ro
    depends_on:
      certs:
        condition: service_completed_successfully
      nbxplorer:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  bitcoin_datadir:
  nbxplorer_datadir:
  postgres_datadir:
  merchant_lnd_datadir:
  customer_lnd_datadir:
  relay_data:
  certs:
  testkit_out:
  btcpay_datadir:
