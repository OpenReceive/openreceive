<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{# The checkout sends this token in X-CSRFToken (csrf-header below), so
   Flask-WTF's CSRFProtect covers the payment routes too. #}
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>{% block title %}{% endblock %}</title>
<link rel="stylesheet" href="/checkout-assets/openreceive-checkout.css">
<script type="module" src="/checkout-assets/openreceive-checkout.js"></script>
</head>
<body>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
