# solid_cable: database-backed ActionCable, no Redis. Single-database setup —
# solid_cable_messages lives in the primary DB (db/migrate), so the optional
# out-of-process worker (openreceive:notifications) broadcasts through the
# database Puma already reads.
development:
  adapter: solid_cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
