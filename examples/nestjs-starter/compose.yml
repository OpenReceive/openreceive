# The starter and a Postgres for it. `docker compose up --build`, then open
# http://localhost:3000. The wallet codes come from .env (see env.example).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "shop", "-d", "shop"]
      interval: 2s
      timeout: 5s
      retries: 30
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://shop:shop@postgres:5432/shop
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  db:
