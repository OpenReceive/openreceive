services:
  buttons-fastapi:
    build:
      context: ../../../..
      dockerfile: examples/buttons/server/fastapi/Dockerfile
    environment:
      PORT: "3007"
      # The shop SURVIVES A RESTART, so its database is a volume rather than a
      # layer in the image. Without this the acceptance demo — close the
      # browser, reopen it, the download still works — would pass until the
      # first `docker compose up --build` and then quietly stop passing.
      OPENRECEIVE_DEMO_DB: /data
    env_file:
      - ../../../../.env
    volumes:
      - buttons-fastapi-data:/data
    expose:
      - "3007"

volumes:
  buttons-fastapi-data:
