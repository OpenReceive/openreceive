# Laravel's public/ as the document root, with every non-file request falling
# through to index.php — no .htaccess, no mod_rewrite. bin/docker-entrypoint
# rewrites the port from $PORT before Apache starts.
<VirtualHost *:3005>
    DocumentRoot /app/examples/buttons/server/laravel/public
    <Directory /app/examples/buttons/server/laravel/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
