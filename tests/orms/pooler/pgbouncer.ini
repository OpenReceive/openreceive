; Transaction pooling, the mode of Supabase's port 6543 (Supavisor) and Neon's
; -pooler hosts. Server-side prepared statements are off, which is stricter
; than either: a client that needs them fails here first.
[databases]
openreceive_test = host=postgres port=5432 dbname=openreceive_test

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_prepared_statements = 0
default_pool_size = 4
max_client_conn = 200
ignore_startup_parameters = extra_float_digits,options
; The test reads SHOW CONFIG to prove it really runs against this mode.
admin_users = openreceive
