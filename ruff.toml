# Python outside packages/python/openreceive (the Django and FastAPI examples,
# tools/conformance, tools/live-nwc-test) lints under the engine's own rules,
# so `ruff check` from the repo root (what CI runs) agrees with `ruff check`
# inside the package. Ruff resolves the nearest config per file, so this only
# applies where no closer pyproject.toml exists.
extend = "packages/python/openreceive/pyproject.toml"

# Ruff 0.16 also formats Python code blocks inside Markdown. The guides and
# agent directions align trailing comments by hand; leave them alone.
extend-exclude = [
  "*.md",
  # The agent trial fixtures stand in for users' own apps, as their
  # frameworks generate them; they keep the frameworks' style, not ours.
  "trials/platforms/*/fixture",
]

# The BTCPay-route test runs these in `odoo shell`, which defines `env`.
[lint.per-file-ignores]
"trials/btcpay-route/odoo/*.py" = ["F821"]
# Odoo's module conventions: the manifest is a bare dict expression, and each
# package's __init__.py imports its submodules only to register them.
"packages/python/odoo/payment_openreceive/__manifest__.py" = ["B018"]
"packages/python/odoo/**/__init__.py" = ["F401"]
