# The Widget Shop as it runs on Replit: Postgres 16 reached directly through
# DATABASE_URL (no pooler). Replit hands the app its environment, DATABASE_URL
# and Secrets, from outside the code; so does this setup.
# The Compose project name is the directory name. The harness swaps 8080 for a
# free port per run.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "shop", "-d", "shop"]
      interval: 2s
      timeout: 5s
      retries: 30
  web:
    build: .
    ports:
      - "127.0.0.1:8080:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  db:
