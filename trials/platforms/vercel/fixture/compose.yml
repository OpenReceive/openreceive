# The Widget Shop as it runs on Vercel: Postgres behind PgBouncer in
# transaction mode (Neon's pooler). Vercel hands a deployment the project's
# environment variables from outside the code; so does this setup.
# The Compose project name is the directory name. The harness swaps 8080 for a
# free port per run.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "shop", "-d", "shop"]
      interval: 2s
      timeout: 5s
      retries: 30
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.0-p0
    entrypoint: ["pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
    volumes:
      - ./infra/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./infra/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build: .
    ports:
      - "127.0.0.1:8080:3000"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 40s
volumes:
  db:
