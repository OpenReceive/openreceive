name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      NWC_URI: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - run: npm run test:package-assets

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NWC_URI: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # package.json's test:ci:core is the one list of per-push gate steps;
      # this job runs it rather than restating it, so the README, CI, and
      # check-workflows.mjs cannot drift apart.
      - run: npm run test:ci:core

  ruby-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (gemspec required_ruby_version >= 3.2) and current.
        ruby-version:
          - "3.2"
          - "3.4"
    # The suites run inside the official Ruby image rather than on the runner:
    # rails_test.rb needs activerecord and sqlite3, and CI must install those
    # from the repo's Gemfile instead of relying on gems that happen to be
    # present on the host.
    container:
      image: ruby:${{ matrix.ruby-version }}
    env:
      NWC_URI: ""
      BUNDLE_PATH: vendor/bundle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/bundle
          # Key on the lockfile, not the Gemfile: lockfile-only bumps must not
          # reuse a stale vendor/bundle. (Per-gem lockfiles are gitignored, so
          # the glob resolves to the root lockfile plus the Rails example's.)
          key: gems-${{ matrix.ruby-version }}-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            gems-${{ matrix.ruby-version }}-
      - run: bundle install --jobs 4
      # The second settlement engine and the cross-language conformance
      # harness run on every PR, not only on developer machines. Driven by a
      # shell entrypoint rather than npm so this container needs Ruby only.
      - run: bundle exec ./tools/ci/ruby-tests.sh
      # Catch gemspec regressions (a broken gemspec once shipped unnoticed
      # because nothing ever ran `gem build`).
      - run: ./tools/ci/ruby-gem-build.sh

  # The fifth settlement engine: the Python package (packages/python/openreceive)
  # on the oldest supported interpreter and the current one, through
  # tools/ci/python-tests.sh (uv sync --frozen, pytest, the cross-language
  # conformance harness). The repository suite runs on SQLite always and, with
  # the two service containers below exporting OPENRECEIVE_TEST_*_URL, on
  # Postgres and MySQL too — the per-dialect lock paths. Django's own tests
  # (tests/django, pytest-django) run in the same pytest invocation once they
  # exist; a Django 5.2 / 6.0 axis is a follow-up for the Django track.
  python-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: openreceive
          POSTGRES_PASSWORD: openreceive
          POSTGRES_DB: openreceive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: openreceive
          MYSQL_DATABASE: openreceive_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -popenreceive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NWC_URI: ""
      # uv honours UV_PYTHON over the package's .python-version, so one script
      # covers both axes.
      UV_PYTHON: ${{ matrix.python-version }}
      OPENRECEIVE_TEST_PGSQL_URL: postgresql+psycopg://openreceive:openreceive@127.0.0.1:5432/openreceive_test
      OPENRECEIVE_TEST_MYSQL_URL: mysql+pymysql://root:openreceive@127.0.0.1:3306/openreceive_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@e06108dd0aef18192324c70427afc47652e63a82 # v7.5.0
        with:
          enable-cache: true
          cache-dependency-glob: packages/python/openreceive/uv.lock
      - run: ./tools/ci/python-tests.sh
      # Lint and strict typing are part of the engine's definition of green.
      - run: uv run --project packages/python/openreceive --frozen ruff check
      - run: uv run --project packages/python/openreceive --frozen ruff format --check
      - run: uv run --project packages/python/openreceive --frozen mypy

  # Browser E2E smoke on every push/PR: boots the node-express Buy a Button
  # demo against the testkit wallet and drives a real checkout in Chromium,
  # then the same smoke spec against the fastify stack (the minimal host).
  # Independent of the core job so the browser lane never blocks the fast
  # checks; the full cross-framework spec matrix runs weekly in demos.yml.
  # The FastAPI stack (the same minimal host in Python) runs the smoke last.
  # Flake policy lives in the Playwright config (retries in CI), never here.
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NWC_URI: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-playwright
      - run: npm run test:e2e:smoke
      - run: npm run test:e2e:smoke:fastify
      # The FastAPI stack: Vite spawns `uv run uvicorn` behind the same proxy
      # trick, so the runner needs uv as well as the browser.
      - uses: astral-sh/setup-uv@e06108dd0aef18192324c70427afc47652e63a82 # v7.5.0
        with:
          enable-cache: true
          cache-dependency-glob: examples/buttons/server/fastapi/uv.lock
      - run: npm run test:e2e:smoke:fastapi

  # Full Buy a Button Rails example on every push/PR, not only in the weekly
  # demos lane: a schema break in the example once shipped because nothing
  # per-push ever executed it. Mirrors demos.yml's buttons-rails job.
  # bin/ci runs setup against the service database, the stubbed-wallet
  # integration tests, the drift checks and the gem audit. database.yml's test
  # default already
  # points at postgres://openreceive:openreceive@127.0.0.1:5432, which the
  # service container below provides, so no DATABASE_URL override is needed.
  rails-example:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NWC_URI: ""
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: openreceive
          POSTGRES_PASSWORD: openreceive
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rails-ci

  # The Buy a Button FastAPI example on every push/PR (the rails-example twin):
  # bin/ci runs uv sync, the stubbed-wallet tests over openreceive.testing, the
  # catalog/artwork drift check, the shared-boundary check and pip-audit.
  fastapi-example:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NWC_URI: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@e06108dd0aef18192324c70427afc47652e63a82 # v7.5.0
        with:
          enable-cache: true
          cache-dependency-glob: examples/buttons/server/fastapi/uv.lock
      - run: bin/ci
        working-directory: examples/buttons/server/fastapi

  # The Buy a Button Django example on every push/PR (the rails-example twin in
  # Python, host-owned Postgres like its compose stack): bin/ci runs uv sync,
  # `manage.py check`, the stubbed-wallet tests over openreceive.testing against
  # the service database, the migration drift check (`makemigrations --check`
  # for the shop AND the openreceive app), the shared-boundary check and
  # pip-audit.
  django-example:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NWC_URI: ""
      DATABASE_URL: postgres://openreceive:openreceive@127.0.0.1:5432/buttons_django
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: openreceive
          POSTGRES_PASSWORD: openreceive
          POSTGRES_DB: buttons_django
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@e06108dd0aef18192324c70427afc47652e63a82 # v7.5.0
        with:
          enable-cache: true
          cache-dependency-glob: examples/buttons/server/django/uv.lock
      - run: bin/ci
        working-directory: examples/buttons/server/django

  # The Buy a Button Laravel example on every push/PR (the rails-example twin in
  # PHP, host-owned Postgres like its compose stack): bin/ci runs composer
  # install, migrate + seed against the service database, the stubbed-wallet
  # feature tests on that database, the migration drift check against the
  # openreceive/laravel install stub, the catalog and shared-boundary checks
  # and composer audit. The E2E smoke against this stack is
  # `npm run test:e2e:smoke:laravel` (demos.yml runs it weekly).
  laravel-example:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NWC_URI: ""
      DATABASE_URL: postgres://openreceive:openreceive@127.0.0.1:5432/buttons_laravel
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: openreceive
          POSTGRES_PASSWORD: openreceive
          POSTGRES_DB: buttons_laravel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2.36.0
        with:
          php-version: "8.2"
          extensions: gmp, sodium, mbstring, pdo_sqlite, pdo_pgsql
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: composer-laravel-example-${{ hashFiles('examples/buttons/server/laravel/composer.lock') }}
          restore-keys: |
            composer-laravel-example-
      - run: bin/ci
        working-directory: examples/buttons/server/laravel

  # The third settlement engine: the BTCPay Server plugin's vector conformance and
  # kernel tests (packages/dotnet). Its own job because compiling BTCPay Server
  # takes minutes and must never slow the JS gate. Regtest integration runs on
  # demand only (packages/dotnet/docker), never per push.
  dotnet-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NWC_URI: ""
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('packages/dotnet/**/*.csproj', 'packages/dotnet/submodules/btcpayserver/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: dotnet build packages/dotnet/BTCPayServer.Plugins.OpenReceive.slnx -nologo -v q
      - run: dotnet test packages/dotnet/BTCPayServer.Plugins.OpenReceive.Tests -nologo -v q --no-build

  # The fourth settlement engine: the PHP package (packages/php/openreceive) on
  # the oldest supported interpreter and a current one, through
  # tools/ci/php-tests.sh (composer validate + install, every PHPUnit suite, the
  # cross-language conformance harness). The repository suite runs on SQLite
  # always and, with the two service containers below exporting the
  # OPENRECEIVE_TEST_*_DSN the tests read, on Postgres and MySQL too — the
  # per-dialect lock paths. ext-gmp is what the NWC transport needs; the
  # remaining extensions are the engine's floor.
  php-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.2"
          - "8.4"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: openreceive
          POSTGRES_PASSWORD: openreceive
          POSTGRES_DB: openreceive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: openreceive
          MYSQL_DATABASE: openreceive_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -popenreceive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NWC_URI: ""
      OPENRECEIVE_TEST_PGSQL_DSN: "pgsql:host=127.0.0.1;port=5432;dbname=openreceive_test"
      OPENRECEIVE_TEST_PGSQL_USER: openreceive
      OPENRECEIVE_TEST_PGSQL_PASSWORD: openreceive
      OPENRECEIVE_TEST_MYSQL_DSN: "mysql:host=127.0.0.1;port=3306;dbname=openreceive_test"
      OPENRECEIVE_TEST_MYSQL_USER: root
      OPENRECEIVE_TEST_MYSQL_PASSWORD: openreceive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2.36.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: gmp, sodium, mbstring, pdo_sqlite, pdo_pgsql, pdo_mysql
          coverage: none
          tools: composer:v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php-version }}-${{ hashFiles('packages/php/*/composer.lock') }}
          restore-keys: |
            composer-${{ matrix.php-version }}-
      # Every packages/php/*/composer.json: validate, install, PHPUnit, then the
      # conformance harness — one entrypoint, shared with `npm run test:php`.
      - run: ./tools/ci/php-tests.sh
      # Static analysis is part of the engine's definition of green (level 8,
      # with the float ban in the money path).
      - run: vendor/bin/phpstan analyse --no-progress
        working-directory: packages/php/openreceive
