name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v0-1-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NWC_URI: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # package.json's test:ci:core is the one list of per-push gate steps;
      # this job runs it rather than restating it, so the README, CI, and
      # check-workflows.mjs cannot drift apart.
      - run: npm run test:ci:core

  ruby-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (gemspec required_ruby_version >= 3.2) and current.
        ruby-version:
          - "3.2"
          - "3.4"
    # The suites run inside the official Ruby image rather than on the runner:
    # rails_test.rb needs activerecord and sqlite3, and CI must install those
    # from the repo's Gemfile instead of relying on gems that happen to be
    # present on the host.
    container:
      image: ruby:${{ matrix.ruby-version }}
    env:
      NWC_URI: ""
      BUNDLE_PATH: vendor/bundle
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor/bundle
          # Key on the lockfile, not the Gemfile: lockfile-only bumps must not
          # reuse a stale vendor/bundle. (Per-gem lockfiles are gitignored, so
          # the glob resolves to the root lockfile plus the Rails example's.)
          key: gems-${{ matrix.ruby-version }}-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            gems-${{ matrix.ruby-version }}-
      - run: bundle install --jobs 4
      # The second settlement engine and the cross-language conformance
      # harness run on every PR, not only on developer machines. Driven by a
      # shell entrypoint rather than npm so this container needs Ruby only.
      - run: bundle exec ./tools/ci/ruby-tests.sh
      # Catch gemspec regressions (a broken gemspec once shipped unnoticed
      # because nothing ever ran `gem build`).
      - run: ./tools/ci/ruby-gem-build.sh

  # Browser E2E smoke on every push/PR: boots the node-express Hello Fruit
  # demo against the testkit wallet and drives a real checkout in Chromium.
  # Independent of v0-1-foundation so the browser lane never blocks the fast
  # checks; the full cross-framework spec matrix runs weekly in demos.yml.
  # Flake policy lives in the Playwright config (retries in CI), never here.
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NWC_URI: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Browser binaries are cached keyed on the locked @playwright/test
      # version: a Playwright bump re-downloads, everything else reuses.
      - name: Read Playwright version
        id: playwright-version
        run: |
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # The demo's vite dev server (the Playwright webServer) resolves
      # @openreceive/* to the packages' built dists; tsx only covers the
      # demo's own TypeScript, so the dists must exist before the run.
      - run: npm run build:packages
      - run: npm run test:e2e:smoke

  # Full Rails Hello Fruit example on every push/PR, not only in the weekly
  # demos lane: a schema break in the example once shipped because nothing
  # per-push ever executed it. Mirrors demos.yml's hello-fruit-rails job.
  # bin/ci runs setup against the service database, the stubbed-wallet
  # integration tests, and the gem audit. database.yml's test default already
  # points at postgres://openreceive:openreceive@127.0.0.1:5432, which the
  # service container below provides, so no DATABASE_URL override is needed.
  rails-example:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NWC_URI: ""
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: openreceive
          POSTGRES_PASSWORD: openreceive
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: examples/hello-fruit/server/rails
          bundler-cache: true
      - run: bin/ci
        working-directory: examples/hello-fruit/server/rails
