name: Publish Gems

# Pushes the three gems to RubyGems.org with Trusted Publishing: the job proves
# its identity with a GitHub OIDC token and RubyGems answers with a 15-minute
# push-only key. No stored credential, no TOTP. RubyGems trusts exactly this
# repository + this filename + the `rubygems` environment (one trusted-publisher
# entry per gem), and the environment admits only v* tags after a human
# approval. Treat edits to this file like edits to a signing key.
#
# Fallback when this cannot run: tools/release/push-gems.sh (manual, OTP).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-gems-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push-gems:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    # Same image as the Ruby lanes in ci.yml: the gems are built and pushed
    # with the container's toolchain, never the runner host's.
    container:
      image: ruby:3.4
    env:
      GEM_ORDER: openreceive openreceive-server openreceive-rails
      GEM_OUT: .release/gems/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A v* tag that does not match the prepared workspace version is a
      # mis-tag; fail before anything is built.
      - name: Assert tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(ruby -rjson -e 'puts JSON.parse(File.read("package.json"))["version"]')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${version}." >&2
            exit 1
          fi
      # Sibling gems are exact-pinned, so the order matters: a consumer must
      # never see openreceive-rails name a version RubyGems does not hold yet.
      - name: Build gems
        run: |
          set -euo pipefail
          version="$(ruby -rjson -e 'puts JSON.parse(File.read("package.json"))["version"]')"
          # RubyGems normalizes "0.2.0-alpha.0" to "0.2.0.pre.alpha.0".
          expected="$(ruby -e 'puts Gem::Version.new(ARGV[0]).to_s' "$version")"
          mkdir -p "$GEM_OUT"
          for name in $GEM_ORDER; do
            (cd "packages/ruby/$name" && gem build "$name.gemspec" --output "$GITHUB_WORKSPACE/$GEM_OUT/$name.gem")
            built="$(ruby -rrubygems/package -e 'puts Gem::Package.new(ARGV[0]).spec.version' "$GEM_OUT/$name.gem")"
            if [ "$built" != "$expected" ]; then
              echo "$name built as $built, expected $expected (package.json $version)." >&2
              exit 1
            fi
            echo "built $name $built"
          done
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      # A re-run after a partial push is safe: a version RubyGems already holds
      # is skipped, and a push RubyGems rejects as a repush counts as done.
      - name: Push gems
        run: |
          set -euo pipefail
          for name in $GEM_ORDER; do
            file="$GEM_OUT/$name.gem"
            version="$(ruby -rrubygems/package -e 'puts Gem::Package.new(ARGV[0]).spec.version' "$file")"
            if curl -fs -o /dev/null "https://rubygems.org/api/v2/rubygems/$name/versions/$version.json"; then
              echo "$name $version is already on RubyGems — skipping"
              continue
            fi
            if out="$(gem push "$file" 2>&1)"; then
              echo "$out"
            else
              echo "$out" >&2
              case "$out" in
                *"already been pushed"*|*"Repushing"*) echo "$name $version already on RubyGems — treating as done" ;;
                *) exit 1 ;;
              esac
            fi
            echo "pushed $name $version — https://rubygems.org/gems/$name/versions/$version"
          done
