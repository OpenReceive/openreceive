name: Publish Composer

# Pushes the two Composer packages to their read-only split repositories —
# OpenReceive/openreceive-php (openreceive/openreceive) and OpenReceive/laravel
# (openreceive/laravel) — which Packagist watches: a `v*` tag there IS the
# release. Packagist cannot read a monorepo, so tools/release/composer-release.mjs
# builds each split (`git subtree split` of the package directory plus, for the
# Laravel adapter, one commit that strips the monorepo's path repository) and
# force-pushes it with the tag. No registry token exists for this path: the one
# credential is a deploy key with write access to the two split repositories,
# stored as COMPOSER_SPLIT_SSH_KEY and released only after a human approves the
# `packagist` environment, which admits v* tags only. Treat edits to this file
# like edits to a signing key.
#
# Fallback when this cannot run: the composer-release.mjs publish command from
# a maintainer machine whose git remotes can push to the split repositories
# (see docs/internal/release-process.md, Composer Track).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-composer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-composer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: packagist
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `git subtree split` rewrites the package directory's whole history
          # into the split repository, so the checkout needs all of it.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # A v* tag that does not match the prepared workspace version is a
      # mis-tag; fail before anything is built.
      - name: Assert tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${version}." >&2
            exit 1
          fi
      # The same build the maintainer runs locally: the split branches, the
      # Laravel composer.json fix-up, and the checks that the split root carries
      # composer.json with no path repository and the lockstep Version.php.
      - name: Build the split branches
        run: |
          set -euo pipefail
          git config user.name "OpenReceive"
          git config user.email "info@openreceive.org"
          node tools/release/composer-release.mjs build
          cat .release/composer/*/*.json
      # The deploy key is written to the runner's ssh config for this step's
      # lifetime only. GitHub's host key is pinned rather than trusted on first
      # use.
      - name: Push the splits and tags, then wait for packagist.org
        env:
          COMPOSER_SPLIT_SSH_KEY: ${{ secrets.COMPOSER_SPLIT_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${COMPOSER_SPLIT_SSH_KEY}" ]; then
            echo "COMPOSER_SPLIT_SSH_KEY is not set in the packagist environment." >&2
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${COMPOSER_SPLIT_SSH_KEY}" > ~/.ssh/id_composer_split
          chmod 600 ~/.ssh/id_composer_split
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_composer_split -o IdentitiesOnly=yes"
          node tools/release/composer-release.mjs publish \
            --remote-openreceive git@github.com:OpenReceive/openreceive-php.git \
            --remote-laravel git@github.com:OpenReceive/laravel.git
          rm -f ~/.ssh/id_composer_split
          echo "published https://packagist.org/packages/openreceive/openreceive and https://packagist.org/packages/openreceive/laravel"
