# Weekly DRIFT DETECTION, not extra coverage. Every command here also runs on
# every push (ci.yml): the value is that the weekly run executes them against
# inputs that FLOAT while the repo stands still —
#
#   - `ubuntu-latest`, which GitHub re-images periodically, and
#   - the `ruby:3.4` container tag, which picks up patch releases.
#
# Node and every npm dependency are pinned (.nvmrc, `npm ci` on the lockfile),
# so a green push run says nothing about those two. Adding a NEW check here
# rather than to ci.yml would be a mistake: it would run weekly instead of
# per-push.

name: Conformance

on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A strict subset of ci.yml's per-push gate, re-run on whatever
  # `ubuntu-latest` currently is.
  js-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NWC_URI: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run check:generated
      - run: npm run test:js

  ruby-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same containerized Ruby lane as CI: no gems installed on the runner host.
    # 3.4 matches the newest version in ci.yml's ruby-engine matrix (3.2/3.4)
    # so the weekly lane never runs a Ruby that per-push CI does not.
    container:
      image: ruby:3.4
    env:
      NWC_URI: ""
      BUNDLE_PATH: vendor/bundle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/bundle
          # Key on the lockfile, not the Gemfile: lockfile-only bumps must not
          # reuse a stale vendor/bundle.
          key: gems-3.4-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            gems-3.4-
      - run: bundle install --jobs 4
      - run: bundle exec ./tools/ci/ruby-tests.sh
