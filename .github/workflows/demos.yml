name: Demos

on:
  schedule:
    - cron: "37 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NWC_URI: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:demo-containers
      # The demo vite configs import the workspace packages' built dists.
      - run: npm run build:packages
      - run: npm run build:demo
      - run: npm run scan:client-bundles
      - run: npm run check:standalone

  # Full browser E2E matrix: every Playwright spec (all four framework tabs,
  # settlement, refund/attention paths) against the node-express demo. The
  # per-push lane in ci.yml runs only the smoke spec; this weekly lane runs
  # the lot. Flake policy lives in the Playwright config (retries in CI),
  # never as workflow-level retries.
  e2e-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NWC_URI: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-playwright
      - run: npm run test:e2e

  # Real-ORM adapter lane: knex, typeorm, and prisma each drive the payments
  # repository through their @openreceive/http factory (knexDb / prismaDb /
  # typeOrmDb) on sqlite. The per-push unit tests pin the factories against
  # fakes shaped like the documented driver behavior; this lane proves them
  # against the actual ORMs, so a raw-API change in an ORM surfaces here
  # instead of in an integrator's checkout.
  orm-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:orms

  # Full Buy a Button Rails demo (host-owned Postgres, like its compose stack).
  # bin/ci runs setup against the service database, the stubbed-wallet
  # integration tests, the schema/catalog drift checks and the gem audit. No
  # importmap audit: the browser client is the Shakapacker bundle, which the
  # demos job above builds (build:demo) and scans for secret/testkit
  # markers (scan:client-bundles).
  buttons-rails:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NWC_URI: ""
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: openreceive
          POSTGRES_PASSWORD: openreceive
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rails-ci

  # The Buy a Button FastAPI demo (SQLite, the minimal Python host): bin/ci runs
  # uv sync, the stubbed-wallet tests, the catalog drift and shared-boundary
  # checks and pip-audit. Its browser client is the Vite bundle the demos job
  # above builds (build:demo) and scans (scan:client-bundles).
  buttons-fastapi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NWC_URI: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: examples/buttons/server/fastapi/uv.lock
      - run: bin/ci
        working-directory: examples/buttons/server/fastapi

  # The Buy a Button Django demo (host-owned Postgres, like its compose stack):
  # bin/ci runs uv sync, `manage.py check`, the stubbed-wallet tests against
  # the service database, the migration drift check, the shared-boundary check
  # and pip-audit. Its browser client is the Vite bundle the demos job above
  # builds (build:demo) and scans (scan:client-bundles). Mirrors ci.yml's
  # per-push django-example job.
  buttons-django:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NWC_URI: ""
      DATABASE_URL: postgres://openreceive:openreceive@127.0.0.1:5432/buttons_django
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: openreceive
          POSTGRES_PASSWORD: openreceive
          POSTGRES_DB: buttons_django
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: examples/buttons/server/django/uv.lock
      - run: bin/ci
        working-directory: examples/buttons/server/django

  # The Buy a Button plain-PHP demo (SQLite, no framework, the standalone
  # checkout build): bin/ci runs composer validate, php -l, the catalog drift
  # and shared-boundary checks and an HTTP order → settle → download smoke over
  # the engine's fakes; then the browser smoke spec drives the same stack
  # through its Vite front door (vite.config.ts spawns `php -S`).
  buttons-php-plain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NWC_URI: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.2"
          extensions: gmp, sodium, mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2
      - uses: ./.github/actions/setup-playwright
      - run: composer install --no-interaction --no-progress --prefer-dist
        working-directory: examples/buttons/server/php-plain
      - run: bin/ci
        working-directory: examples/buttons/server/php-plain
      - run: npm run test:e2e:smoke:php-plain

  # Full Buy a Button Laravel demo (host-owned Postgres, like its compose
  # stack): bin/ci as in ci.yml's laravel-example, then the browser smoke
  # against the stack — Vite fronting `php artisan serve` against the
  # engine's fakes under DEMO_WALLET=testkit, the same spec every stack runs.
  buttons-laravel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NWC_URI: ""
      DATABASE_URL: postgres://openreceive:openreceive@127.0.0.1:5432/buttons_laravel
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: openreceive
          POSTGRES_PASSWORD: openreceive
          POSTGRES_DB: buttons_laravel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.2"
          extensions: gmp, sodium, mbstring, pdo_sqlite, pdo_pgsql
          coverage: none
          tools: composer:v2
      - uses: ./.github/actions/setup-playwright
      - run: bin/ci
        working-directory: examples/buttons/server/laravel
      - run: npm run test:e2e:smoke:laravel
