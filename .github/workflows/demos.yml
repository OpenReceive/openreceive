name: Demos

on:
  schedule:
    - cron: "37 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hello-fruit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NWC_URI: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:demo-containers
      # The demo vite configs import the workspace packages' built dists.
      - run: npm run build:packages
      - run: npm run build:demo
      - run: npm run scan:client-bundles

  # Minimal Rails generator-install sample (SQLite, Lightning-only, no Docker).
  # bin/ci runs setup (bundle install + db:prepare), the stubbed-wallet
  # integration tests, and the gem/importmap audits.
  hello-fruit-rails-quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NWC_URI: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: examples/hello-fruit-rails
          bundler-cache: true
      - run: bin/ci
        working-directory: examples/hello-fruit-rails

  # Full Rails Hello Fruit demo (host-owned Postgres, like its compose stack).
  # bin/ci runs setup against the service database, the stubbed-wallet
  # integration tests, and the gem audit (no importmap audit: the browser
  # client is the Shakapacker bundle, audited by the workspace npm tooling).
  hello-fruit-rails:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NWC_URI: ""
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: openreceive
          POSTGRES_PASSWORD: openreceive
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: examples/hello-fruit/server/rails
          bundler-cache: true
      - run: bin/ci
        working-directory: examples/hello-fruit/server/rails
