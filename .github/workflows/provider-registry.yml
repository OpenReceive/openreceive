name: Provider Registry

on:
  schedule:
    - cron: "51 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate
      # tsx resolves the workspace packages from src via tsconfig paths, so no
      # package build is needed on a clean runner.
      - run: node --import tsx --test tests/provider-data.test.mjs
