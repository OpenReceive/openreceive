name: Release Dry Run

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NWC_URI: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # A v* tag that does not match the prepared workspace version is a
      # mis-tag; fail before any release checks run against the wrong tree.
      - name: Assert tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${version}." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run check:release
      # test:package-smoke builds each publishable package against the others'
      # dist/ output — @openreceive/angular resolves
      # `@openreceive/elements/wrapper-shared` to a .d.ts that only exists once
      # elements is built. In ci.yml the smoke inherits that build from
      # `npm test` (pretest:js), so it passes there and fails here on a fresh
      # checkout. Build first rather than depend on a neighbouring step.
      - run: npm run build:packages
      - run: npm run test:package-smoke
      # With ci.yml (test:ci:core, the Ruby lanes, the Rails example) these make
      # the two per-push workflows cover every step of `npm run test:ci`, which
      # is what lets release:publish skip the local suite when both are green
      # on the commit being published (tools/release/npm-release.mjs).
      - run: npm run check:demo-containers
      - run: npm run test -w @openreceive/example-buttons-rails
      - run: npm run build:demo
      - run: npm run scan:client-bundles
      - run: npm run build:docs
      - run: echo "Release dry run complete. Publishing requires explicit maintainer approval."
