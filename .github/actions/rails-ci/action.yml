name: Rails example CI
description: >-
  Ruby + bundler cache, then `bin/ci` in the Buy a Button Rails example
  (setup against the service database, the stubbed-wallet integration tests,
  the schema/catalog drift checks and the gem audit). Shared by ci.yml's
  per-push rails-example and demos.yml's buttons-rails so the two lanes cannot
  drift.

runs:
  using: composite
  steps:
    - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
      with:
        working-directory: examples/buttons/server/rails
        bundler-cache: true
    - run: bin/ci
      shell: bash
      working-directory: examples/buttons/server/rails
